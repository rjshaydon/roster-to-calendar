name: Inspect facility bootstrap canary

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "One explicitly allowed hospital"
        required: true
        type: choice
        options:
          - mmc
          - mch
          - ddh
          - vhh
          - casey
      file_id:
        description: "Exact active roster file identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ROSTER_AUTOMATION_TOKEN: ${{ secrets.ROSTER_AUTOMATION_TOKEN }}
      SOURCE_TYPE: ${{ inputs.source_type }}
      FILE_ID: ${{ inputs.file_id }}
    steps:
      - name: Inspect one file without writing
        run: |
          request_body="$(jq -n --arg sourceType "${SOURCE_TYPE}" --arg fileId "${FILE_ID}" '{sourceType: $sourceType, fileId: $fileId}')"
          http_status="$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${ROSTER_AUTOMATION_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${request_body}" \
            --dump-header response-headers.txt \
            --output response.json \
            --write-out '%{http_code}' \
            "https://roster-to-calendar.pages.dev/api/automation/facility-bootstrap")"
          request_id="$(awk 'BEGIN { IGNORECASE=1 } /^cf-ray:/ { gsub(/\r/, "", $2); print $2; exit }' response-headers.txt)"
          test -n "${request_id}"
          jq -n --arg requestId "${request_id}" --arg httpStatus "${http_status}" '{requestId: $requestId, httpStatus: $httpStatus}'
          if jq empty response.json >/dev/null 2>&1; then
            jq . response.json
          else
            jq -n --arg status "${http_status}" '{ok: false, httpStatus: $status, error: "Non-JSON response from bootstrap inspection."}'
          fi
          test "${http_status}" = "200"
