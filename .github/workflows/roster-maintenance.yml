name: Continue bounded roster maintenance
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      seed_current_views:
        description: "Queue one bounded refresh of retained current-term views"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  maintain:
    strategy:
      fail-fast: false
      matrix:
        source: [monash-adults, monash-paeds, dandenong-findmyshift, vhh-active-medical-roster]
    concurrency:
      group: roster-production-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ROSTER_AUTOMATION_SOURCE_ID: ${{ matrix.source }}
      ROSTER_AUTOMATION_BASE_URL: https://roster-to-calendar.pages.dev
      ROSTER_SEED_CURRENT_VIEWS: ${{ inputs.seed_current_views == true && 'true' || 'false' }}
      ROSTER_AUTOMATION_TOKEN: ${{ secrets.ROSTER_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/process-roster-maintenance.mjs
