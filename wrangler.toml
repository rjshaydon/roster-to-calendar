name = "roster-to-calendar"
compatibility_date = "2026-04-22"
pages_build_output_dir = "public"

[limits]
cpu_ms = 30_000

[[analytics_engine_datasets]]
binding = "REQUEST_ANALYTICS"
dataset = "roster_api_invocations"

[vars]
# Credentials remain encrypted; general migration occurs only after successful login.
ROSTER_AUTH_ROLLOUT = '{"enabled":true,"sessionsEnabled":true,"migrationEnabled":true,"signupEnabled":true,"passkeysEnabled":true,"requestsEnabled":true,"requestsAdminOnly":false,"requestTransfersEnabled":true,"emailDeliveryReady":false,"legacyStateUntil":"2026-10-20T00:00:00.000Z"}'
ROSTER_COMPARISON_ENABLED = "true"
FACILITY_OVERVIEW_MAINTENANCE_MODE = "false"
FACILITY_OVERVIEW_AUTOMATIC_LAUNCH_ENABLED = "true"
ON_SHIFT_FOR_ALL_ENABLED = "true"
FACILITY_SHARED_ROLLOUT_ACTIVE = "true"
FACILITY_SHARED_EMERGENCY_PAUSED = "false"
FACILITY_LEGACY_READS_PAUSED = "true"
FACILITY_MATERIALIZATION_SOURCE_ALLOWLIST = "ddh,mmc,mch,vhh"
FACILITY_SHARED_READER_SOURCE_ALLOWLIST = "mmc,ddh,mch,vhh"
FACILITY_SHARED_READER_COHORT = "all"
FACILITY_ACCESS_MATERIALIZATION_ENABLED = "false"
FACILITY_SHARED_METADATA_BUILD_ENABLED = "false"
FACILITY_SHARED_DAYS_BUILD_ENABLED = "false"
FACILITY_SHARED_CONTACTS_BUILD_ENABLED = "true"
FACILITY_SHARED_METADATA_ENABLED = "true"
FACILITY_SHARED_DAYS_ENABLED = "true"
FACILITY_SHARED_CONTACTS_ENABLED = "true"
FACILITY_SHARED_CONTACTS_SOURCE_ALLOWLIST = "ddh,mmc,mch,vhh"
ROSTER_AUTOMATION_WRITES_ENABLED = "true"
MANUAL_ROSTER_WRITES_ENABLED = "false"
ROSTER_STATUS_SUMMARY_ENABLED = "true"
ROSTER_AUTOMATION_SOURCE_ALLOWLIST = "monash-adults,monash-paeds,dandenong-findmyshift,vhh-active-medical-roster"
ROSTER_AUTOMATION_QUEUE_ENABLED = "true"
ROSTER_AUTOMATION_BOUNDED_IMPORT_ENABLED = "true"
ROSTER_AUTOMATION_PATCH_IMPORT_ENABLED = "true"
ROSTER_ACCOUNT_BUDGET_ENABLED = "true"
ACCOUNT_MAINTENANCE_PREVIEW_SUMMARY_ENABLED = "true"
FACILITY_AUTOMATIC_PUBLICATION_ENABLED = "true"
ROSTER_AUTOMATION_REVIEWED_FACT_LIMIT = "1250"
# Advanced recovery/inspection and its allowlist use their closed defaults.
# Omit redundant disabled variables to stay below Workers Free's 64-variable cap.
FACILITY_BOOTSTRAP_EXECUTION_ENABLED = "false"
CONTACT_AUTOMATION_WRITES_ENABLED = "true"
CONTACT_AUTOMATION_SOURCE_ALLOWLIST = "ddh-daily-contact-sheet,mmc-shift-allocations,vhh-shift-phone-allocations"
IDENTITY_DISCOVERY_ENABLED = "true"
IDENTITY_REVIEW_ENABLED = "true"
SUBSCRIPTION_ARTIFACT_MODE = "ready"
IDENTITY_EXTERNAL_AUDIT_ENABLED = "true"
IDENTITY_REGISTRY_ENABLED = "true"
IDENTITY_SCHEDULED_AUDIT_ENABLED = "true"
ACCOUNT_SNAPSHOT_BUILD_ENABLED = "false"
CREATOR_STARTUP_HYDRATION_ENABLED = "false"
CREATOR_DIRECTORY_ENABLED = "true"
SESSION_SETTINGS_SAVE_ENABLED = "true"
ROSTER_VISIBLE_REFRESH_ENABLED = "true"
ROSTER_METADATA_CHECK_ENABLED = "true"
BOUNDED_MANUAL_ROSTER_ENABLED = "true"
ROSTER_BOUNDED_REPLACEMENT_ENABLED = "true"
ROSTER_INSIGHT_READS_ENABLED = "true"

[[d1_databases]]
binding = "ROSTER_DB"
database_name = "roster-converter-calendar"
database_id = "237d0d52-3a7c-4e02-8648-9f4dedbc1cb0"
preview_database_id = "541d7779-a43a-4603-a4ab-c95e9b4b015d"

# Read-only receipt summaries in code; never used for roster/identity writes.
[[d1_databases]]
binding = "ROSTER_MAINTENANCE_PREVIEW_DB"
database_name = "roster-identity-batch2-preview"
database_id = "741ce534-eafe-4aa7-9305-7b7ed5661979"

[[r2_buckets]]
binding = "ROSTER_FILES"
bucket_name = "roster-converter-source-files"
preview_bucket_name = "roster-converter-source-files-preview"

[[r2_buckets]]
binding = "ROSTER_CACHE"
bucket_name = "roster-converter-cache"
preview_bucket_name = "roster-converter-cache-preview"

[[services]]
binding = "AUTH_LOGIN_LIMITER"
service = "roster-auth-admission"

[env.preview.vars]
ROSTER_COMPARISON_ENABLED = "false"
