ROSTER_AUTOMATION_REVIEWED_FACT_LIMIT = "0"
ROSTER_AUTOMATION_REVIEWED_CONTENT_SHA256 = ""
ROSTER_ADVANCED_MAINTENANCE_ENABLED = "false"
